<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #00adb5, #393e46);
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 500px;
            margin: 40px auto;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .gender {
            margin-top: 5px;
        }

        .gender input {
            width: auto;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background: #00adb5;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #007b80;
        }

        .error {
            color: red;
            font-size: 13px;
        }

        .success {
            color: green;
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Student Registration Form</h2>

    <form id="regForm" onsubmit="return validateForm()">

        <label>Full Name</label>
        <input type="text" id="name">
        <div class="error" id="nameError"></div>

        <label>Roll Number</label>
        <input type="text" id="roll">
        <div class="error" id="rollError"></div>

        <label>Email ID</label>
        <input type="text" id="email">
        <div class="error" id="emailError"></div>

        <label>Mobile Number</label>
        <input type="text" id="mobile">
        <div class="error" id="mobileError"></div>

        <label>Password</label>
        <input type="password" id="password">
        <div class="error" id="passError"></div>

        <label>Confirm Password</label>
        <input type="password" id="confirmPassword">
        <div class="error" id="confirmPassError"></div>

        <label>Gender</label>
        <div class="gender">
            <input type="radio" name="gender" value="Male"> Male
            <input type="radio" name="gender" value="Female"> Female
        </div>
        <div class="error" id="genderError"></div>

        <label>Department</label>
        <select id="dept">
            <option value="">--Select--</option>
            <option>IT</option>
            <option>CSE</option>
            <option>EEE</option>
            <option>ECE</option>
            <option>CIVIL</option>
            <option>Mechanical</option>
            <option>Chemical</option>
        </select>
        <div class="error" id="deptError"></div>

        <label>Date of Birth</label>
        <input type="date" id="dob">
        <div class="error" id="dobError"></div>

        <button type="submit">Submit</button>

        <div class="success" id="successMsg"></div>
    </form>
</div>

<script>
function validateForm() {

    let isValid = true;

    // Clear previous errors
    document.querySelectorAll(".error").forEach(e => e.innerHTML = "");
    document.getElementById("successMsg").innerHTML = "";

    let name = document.getElementById("name").value.trim();
    let roll = document.getElementById("roll").value.trim();
    let email = document.getElementById("email").value.trim();
    let mobile = document.getElementById("mobile").value.trim();
    let password = document.getElementById("password").value;
    let confirmPassword = document.getElementById("confirmPassword").value;
    let dept = document.getElementById("dept").value;
    let dob = document.getElementById("dob").value;
    let gender = document.querySelector('input[name="gender"]:checked');

    // Name validation
    if (name === "") {
        document.getElementById("nameError").innerHTML = "Full Name is required";
        isValid = false;
    }

    // Roll validation (letters + numbers only)
    let rollPattern = /^[a-zA-Z0-9]+$/;
    if (!rollPattern.test(roll)) {
        document.getElementById("rollError").innerHTML = "Invalid Roll Number";
        isValid = false;
    }

    // Email validation
    let emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
    if (!emailPattern.test(email)) {
        document.getElementById("emailError").innerHTML = "Invalid Email";
        isValid = false;
    }

    // Mobile validation
    let mobilePattern = /^[0-9]{10}$/;
    if (!mobilePattern.test(mobile)) {
        document.getElementById("mobileError").innerHTML = "Mobile must be 10 digits";
        isValid = false;
    }

    // Password validation
    if (password.length < 8) {
        document.getElementById("passError").innerHTML = "Password must be at least 8 characters";
        isValid = false;
    }

    // Confirm password
    if (password !== confirmPassword) {
        document.getElementById("confirmPassError").innerHTML = "Passwords do not match";
        isValid = false;
    }

    // Gender validation
    if (!gender) {
        document.getElementById("genderError").innerHTML = "Select Gender";
        isValid = false;
    }

    // Department validation
    if (dept === "") {
        document.getElementById("deptError").innerHTML = "Select Department";
        isValid = false;
    }

    // DOB validation
    if (dob === "") {
        document.getElementById("dobError").innerHTML = "Select Date of Birth";
        isValid = false;
    }

    // Success message
    if (isValid) {
        document.getElementById("successMsg").innerHTML = "Registration Successful!";
        return false; // prevent actual form submission
    }

    return false;
}
</script>

</body>
</html>
